apply plugin: 'com.android.application'
apply plugin: 'com.google.devtools.ksp'

def noKeyFound = '"NO_KEY_FOUND"'
def googleMapsAPIKey = noKeyFound
def thisAppLicensingKey = noKeyFound

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
    if (localProperties['GOOGlE_MAPS_API_KEY']) {
        googleMapsAPIKey = localProperties['GOOGlE_MAPS_API_KEY']
    }
    if (localProperties['LICENSE_KEY']) {
        thisAppLicensingKey = localProperties['LICENSE_KEY']
    }
} else {
    println("local.properties file not found.")
}

if (googleMapsAPIKey == noKeyFound) {
    throw new GradleException("Google Maps API key not found. Please add 'googleMapsAPIKey' to your local.properties file.")
}

android {

    compileSdk = 36

    defaultConfig {
        applicationId "app.simple.positional"
        minSdkVersion 24
        //noinspection OldTargetApi
        targetSdkVersion 36
        versionCode 20260512
        versionName "v2026.05.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        resValue "string", "googleMapsAPIKey", googleMapsAPIKey
        resValue "string", "thisAppLicensingKey", thisAppLicensingKey
        resValue "string", "versionName", versionName

        ksp {
            arg("room.schemaLocation", "$projectDir/databases/schemas")
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "_debug"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget = "JVM_21"
        }
    }

    namespace 'app.simple.positional'

    buildFeatures {
        aidl true
        buildConfig true
        viewBinding false
        resValues true
    }
}

dependencies {

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    //noinspection GradleDependency
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // Kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Google Services and Default android libs
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.maps.android:android-maps-utils:4.3.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    // Third Party
    implementation 'org.shredzone.commons:commons-suncalc:3.11'
    implementation 'com.github.kylecorry31:Geo-Coordinate-Conversion-Java:360781e5be'
    implementation 'com.github.vipulasri:timelineview:1.2.2'

    // Room components
    implementation "androidx.room:room-ktx:2.8.4"
    ksp "androidx.room:room-compiler:2.8.4"
    androidTestImplementation "androidx.room:room-testing:2.8.4"

    // Leak Canary -- debugImplementation because LeakCanary should only run in debug builds.
    // debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.5'
}